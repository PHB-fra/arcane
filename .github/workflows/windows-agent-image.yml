name: Windows agent image (unofficial preview)

on:
  push:
    branches: [windows-agent-preview]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/phb-fra/arcane-agent-windows

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build arcane-agent.exe
        shell: pwsh
        run: |
          $meta = Get-Content .arcane.json -Raw | ConvertFrom-Json
          $pkg = 'github.com/getarcaneapp/arcane/backend/v2/internal/config'
          $buildTime = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          Push-Location backend
          go build -tags exclude_frontend -trimpath `
            -ldflags "-w -s -X $pkg.Version=$($meta.version) -X $pkg.Revision=$env:GITHUB_SHA -X $pkg.BuildTime=$buildTime" `
            -o ..\out\arcane-agent.exe .\cmd\main.go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          "VERSION=$($meta.version)" >> $env:GITHUB_ENV
          "TAG=$($meta.version)-ltsc2022-preview" >> $env:GITHUB_ENV

      - name: Build image
        shell: pwsh
        run: |
          docker build -f docker/Dockerfile-agent-windows `
            -t "${env:IMAGE}:${env:TAG}" -t "${env:IMAGE}:ltsc2022-preview" `
            --label "org.opencontainers.image.source=https://github.com/$env:GITHUB_REPOSITORY" `
            --label "org.opencontainers.image.revision=$env:GITHUB_SHA" `
            --label "org.opencontainers.image.version=$env:VERSION" `
            --label "org.opencontainers.image.description=Unofficial preview of the Arcane agent as a Windows Server 2022 container. Not supported by the Arcane maintainers." `
            out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test
        shell: pwsh
        run: |
          docker run -d --name smoke --isolation process `
            -e AGENT_TOKEN=arc_smoketest -e MANAGER_API_URL=http://127.0.0.1:9 `
            -v \\.\pipe\docker_engine:\\.\pipe\docker_engine `
            "${env:IMAGE}:${env:TAG}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ip = docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' smoke
          $ok = $false
          foreach ($i in 1..30) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 "http://${ip}:3553/api/health"
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            if ((docker inspect -f '{{.State.Running}}' smoke) -ne 'true') { break }
            Start-Sleep -Seconds 2
          }
          docker logs smoke
          docker rm -f smoke | Out-Null
          if (-not $ok) { Write-Error 'The agent did not answer /api/health'; exit 1 }

      - name: Upload arcane-agent.exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arcane-agent-windows-amd64
          path: out/arcane-agent.exe

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        shell: pwsh
        run: |
          docker push "${env:IMAGE}:${env:TAG}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker push "${env:IMAGE}:ltsc2022-preview"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = (docker inspect -f '{{index .RepoDigests 0}}' "${env:IMAGE}:${env:TAG}").Split('@')[1]
          "digest=$digest" >> $env:GITHUB_OUTPUT
          "Pushed ``${env:IMAGE}:${env:TAG}`` (``$digest``)" >> $env:GITHUB_STEP_SUMMARY

      - name: Image attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
