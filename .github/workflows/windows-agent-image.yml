name: Windows agent image (unofficial preview)

on:
  push:
    branches: [windows-agent-preview]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/phb-fra/arcane-agent-windows

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            docker/windows-image/go.sum

      - name: Build arcane-agent.exe
        shell: pwsh
        run: |
          $meta = Get-Content .arcane.json -Raw | ConvertFrom-Json
          $pkg = 'github.com/getarcaneapp/arcane/backend/v2/internal/config'
          $buildTime = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          Push-Location backend
          go build -tags exclude_frontend -trimpath `
            -ldflags "-w -s -X $pkg.Version=$($meta.version) -X $pkg.Revision=$env:GITHUB_SHA -X $pkg.BuildTime=$buildTime" `
            -o ..\out\arcane-agent.exe .\cmd\main.go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          "VERSION=$($meta.version)" >> $env:GITHUB_ENV

      # The images are assembled without a Docker daemon: a Windows Server 2022 runner
      # cannot build a Windows Server 2019 image with process isolation.
      - name: Build images
        shell: pwsh
        run: |
          $env:GOWORK = 'off'
          go build -C docker/windows-image -o ..\..\out\windows-image.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $labels = @(
            '-label', "org.opencontainers.image.source=https://github.com/$env:GITHUB_REPOSITORY",
            '-label', "org.opencontainers.image.revision=$env:GITHUB_SHA",
            '-label', "org.opencontainers.image.version=$env:VERSION",
            '-label', 'org.opencontainers.image.description=Unofficial preview of the Arcane agent as a Windows Server container. Not supported by the Arcane maintainers.'
          )
          $bases = @{
            'ltsc2019' = 'mcr.microsoft.com/windows/nanoserver:1809'
            'ltsc2022' = 'mcr.microsoft.com/windows/nanoserver:ltsc2022'
          }
          foreach ($release in $bases.Keys) {
            .\out\windows-image.exe build -base $bases[$release] -exe out\arcane-agent.exe `
              -tag "${env:IMAGE}:${env:VERSION}-${release}-preview" -out "out\${release}.tar" `
              -load-out "out\${release}-load.tar" @labels
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Start Docker engine
        shell: pwsh
        run: |
          $svc = Get-Service docker -ErrorAction SilentlyContinue
          if (-not $svc) { Write-Error 'The Docker engine service is not installed on this runner'; exit 1 }
          if ($svc.Status -ne 'Running') { Start-Service docker }
          foreach ($i in 1..30) {
            docker version --format '{{.Server.Os}} {{.Server.Version}}' 2>$null
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 2
          }
          Write-Error 'The Docker engine did not start'; exit 1

      # Only the Windows Server 2022 image can run on this runner (process isolation).
      - name: Smoke test (ltsc2022)
        shell: pwsh
        run: |
          docker load -i out\ltsc2022-load.tar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker run -d --name smoke --isolation process `
            -e AGENT_TOKEN=arc_smoketest -e MANAGER_API_URL=http://127.0.0.1:9 `
            -v \\.\pipe\docker_engine:\\.\pipe\docker_engine `
            "${env:IMAGE}:${env:VERSION}-ltsc2022-preview"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ip = docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' smoke
          $ok = $false
          foreach ($i in 1..30) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 "http://${ip}:3553/api/health"
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            if ((docker inspect -f '{{.State.Running}}' smoke) -ne 'true') { break }
            Start-Sleep -Seconds 2
          }
          docker logs smoke
          docker rm -f smoke | Out-Null
          if (-not $ok) { Write-Error 'The agent did not answer /api/health'; exit 1 }

      - name: Upload arcane-agent.exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arcane-agent-windows-amd64
          path: out/arcane-agent.exe

      - name: Push ltsc2019 image
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        id: push2019
        shell: pwsh
        run: |
          .\out\windows-image.exe push -tar out\ltsc2019.tar `
            -tag "${env:IMAGE}:${env:VERSION}-ltsc2019-preview" -tag "${env:IMAGE}:ltsc2019-preview"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Push ltsc2022 image
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        id: push2022
        shell: pwsh
        run: |
          .\out\windows-image.exe push -tar out\ltsc2022.tar `
            -tag "${env:IMAGE}:${env:VERSION}-ltsc2022-preview" -tag "${env:IMAGE}:ltsc2022-preview"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Windows hosts pull the entry matching their own release from these tags.
      - name: Push multi-release index
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        id: index
        shell: pwsh
        run: |
          .\out\windows-image.exe index -tag "${env:IMAGE}:${env:VERSION}-ltsc-preview" `
            -from "${env:IMAGE}:${env:VERSION}-ltsc2019-preview" -from "${env:IMAGE}:${env:VERSION}-ltsc2022-preview"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\out\windows-image.exe index -tag "${env:IMAGE}:ltsc-preview" `
            -from "${env:IMAGE}:${env:VERSION}-ltsc2019-preview" -from "${env:IMAGE}:${env:VERSION}-ltsc2022-preview"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @(
            "| Tag | Digest |"
            "| --- | --- |"
            "| ``ltsc2019-preview`` | ``${{ steps.push2019.outputs.digest }}`` |"
            "| ``ltsc2022-preview`` | ``${{ steps.push2022.outputs.digest }}`` |"
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY

      # The attestation action pushes to GHCR with the Docker credentials.
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image attestation (ltsc2019)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push2019.outputs.digest }}
          push-to-registry: true

      - name: Image attestation (ltsc2022)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push2022.outputs.digest }}
          push-to-registry: true

      - name: Image attestation (multi-release index)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
